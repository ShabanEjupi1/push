[main]
user = mk.com.snt.kc.warehouse.view.security.FacesAjaxAwareUserFilter
user.loginUrl = /login
anyrole = mk.com.snt.kc.warehouse.view.security.AnyRoleAuthorizationFilter

# NOTE: Shiro matches these top-down and the FIRST match wins, so the
# "/** = user" catch-all at the bottom must stay last.
#
# It is there because this list used to be a pure allow-list: any path not named
# here got NO filter at all. That silently left /home_OLD.xhtml,
# /home_NEW_10.xhtml and /help.xhtml reachable without logging in, and it meant
# every new page was public until someone remembered to add a line here. It is
# now fail-closed: unknown paths require a session.
[urls]

# --- must stay reachable while logged out ---
# JSF/PrimeFaces serve the login page's CSS, JS, theme and favicon from here.
# Locking this down makes the login page render unstyled with dead buttons.
/javax.faces.resource/** = anon
# Static images and stylesheets referenced by absolute path rather than through
# the JSF resource handler - e.g. the p:graphicImage tags in template.xhtml.
#
# These MUST be anon, and not just for styling. The "user" filter denies an
# anonymous request by calling saveRequestAndRedirectToLogin(), which stores
# that URL in the session, and Login.submit() then sends the user to the stored
# URL after a successful login. The login page itself contains
# <p:graphicImage value="/resources/images/ajaxloadingbar.gif"/> (the PDF
# progress dialog), so the browser fetched that gif while showing the login
# form, the fetch was denied and saved, and logging in landed the user on
#   /warehouse/resources/images/ajaxloadingbar.gif?pfdrid_c=true
# instead of the home page. Letting the images through means nothing is ever
# saved for them and the saved request stays the page the user actually wanted.
#
# Scoped to css/ and images/ on purpose: /resources/snt/** holds composite
# component .xhtml files, which stay behind the login.
/resources/css/**        = anon
/resources/images/**     = anon
# Same trap: browsers ask for this on their own, out of band.
/favicon.ico             = anon
# Error pages must render for anonymous users too, or a 404 turns into a
# redirect loop back to the login screen.
/errorpages/**           = anon
# Bare context root -> welcome-file (login.xhtml), same behaviour as before.
/                        = anon

# --- the login page itself ---
# The "user" filter lets its own loginUrl through (UserFilter.onAccessDenied ->
# isLoginRequest), so this both serves the page and processes the POST.
/login       = user
/login.xhtml = user

# --- application pages ---
/home              = user
/home.xhtml        = user
/daily_exits       = user
/daily_exits.xhtml = user
/report            = user
/report.xhtml      = user
#/report1          = user
#/report1.xhtml    = user
/excel             = user
/excel.xhtml       = user

# --- admin only ---
/admin/** = user, anyrole[ROLE_ADMIN]

# --- everything else: login required (keep last) ---
/** = user
